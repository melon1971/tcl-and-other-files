# /etc/sysctl.d/99-hardening.conf
# Extra kernel/network hardening for Debian 12/13, on top of locsec.
# Apply: sudo sysctl --system
# Verify: sysctl kernel.kexec_load_disabled (spot-check keys below)
#
# locsec owns its own settings in 60-locsec-hardening.conf. This file loads
# after it, so it deliberately sets NO key that locsec sets, and none of the
# keys locsec leaves out on purpose (rp_filter = 1, accept_ra, sysrq,
# unprivileged_userns_clone, perf_event_paranoid, forwarding). That keeps
# locsec's values, and locsec's 61-*.conf override files, in charge.
# Do not add any of those keys here.
#
# A leading "-" on a key means "skip quietly if this kernel doesn't have it",
# so the file applies cleanly on both Debian 12 (kernel 6.1) and 13.

###############################################################################
# Kernel
###############################################################################

# Disable kexec (prevents replacing the running kernel). Also disables kdump
# crash dumps, and cannot be turned back on until the next reboot.
kernel.kexec_load_disabled = 1

# Append the PID to core dump file names
kernel.core_uses_pid = 1

# Restrict userfaultfd to privileged users
vm.unprivileged_userfaultfd = 0

# Don't load TTY line disciplines on demand (common exploit primitive)
dev.tty.ldisc_autoload = 0

# Block terminal input injection via the TIOCSTI ioctl (kernel 6.2+;
# skipped on Debian 12)
-dev.tty.legacy_tiocsti = 0

###############################################################################
# Network - IPv4
###############################################################################

# SYN flood tuning (locsec already turns on tcp_syncookies)
net.ipv4.tcp_syn_retries = 5
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 4096

# Disable ARP proxying (also for interfaces created later)
net.ipv4.conf.all.proxy_arp = 0
net.ipv4.conf.default.proxy_arp = 0

# TCP hardening
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_timestamps = 0

###############################################################################
# Memory / misc
###############################################################################

# Full ASLR
kernel.randomize_va_space = 2

# More mmap address randomisation (maximum on x86_64; skipped where the
# architecture doesn't support these values)
-vm.mmap_rnd_bits = 32
-vm.mmap_rnd_compat_bits = 16

# Keep kernel messages off the console (only errors and worse are printed)
kernel.printk = 3 3 3 3

# Increase mmap minimum address (NULL-deref exploit mitigation)
vm.mmap_min_addr = 65536
