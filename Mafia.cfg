########################################################################
# Mafia.cfg - tunable settings for mafia.tcl
#
# Edit the values below and .rehash the bot to pick up changes -- you
# never need to touch mafia.tcl itself for ordinary configuration.
#
# Each line is a bare "variable NAME value" -- mafia.tcl sources this
# file from inside its own namespace, so no ::mafia:: prefix is needed
# here (same pattern as Duck Hunt's Duck_Hunt.cfg / Duck_Hunt.tcl).
#
# VALIDATION: every setting below is range-checked at load by
# ::mafia::validate_config, using the same bounds !mafiaadmin config
# enforces. A value outside its range -- or a line you delete -- is
# logged and replaced with the default shown in that check, so the bot
# starts in a sane state instead of failing at the first command. Watch
# the partyline on load: "mafia.tcl: CONFIG: <key> ... is invalid"
# means the value you typed here is NOT the one in effect.
#
# Until that check existed, this file was the unguarded path into the
# game's settings: admin_flags "" handed !mafiaadmin to everyone,
# dealer_refund_pct 100 was an unlimited money loop, an inverted
# jail_bribe pair paid players to leave jail, and max_level 1 was a
# divide-by-zero on every command -- all of them refused by
# !mafiaadmin config, all of them accepted here.
########################################################################

##### ---------------- CHANNEL / BOT BEHAVIOR ---------------- #####
# Which channels the game runs in. "" = every channel the bot is on.
# Otherwise list one or more channels separated by spaces:
#   variable chan "#mafia"
#   variable chan "#mafia #mafia2 #crime"
variable chan          "#mafia #prototype"
variable db_dir         ""          ;# directory for the SQLite file; "" = same dir as the bot
variable save_interval  5          ;# minutes between autosaves
variable cmd_prefix     "!"
variable output_mode    "notice"    ;# notice, privmsg, or channel
# Eggdrop flags allowed to use !mafiaadmin. Uses the same syntax as
# matchattr, e.g. "n|m" = bot owners or masters.
# Must be a non-empty flag string with NO spaces. An empty value makes
# matchattr match every user, which would hand !mafiaadmin -- give,
# reset and prune included -- to anyone in the channel. Refused at load.
variable admin_flags    "n|m"

##### ---------------- FLOOD CONTROL ---------------- #####
# Per-nick limit on !mafia / !mafiahelp / !mafiaadmin: a burst of
# cmd_burst commands, then one more every cmd_refill_secs seconds (0 turns
# the limit off). Commands over the limit are ignored silently.
variable cmd_burst        5
variable cmd_refill_secs  2
# Bot-wide cap on new !mafia register accounts per minute (stops a client
# cycling throwaway nicks from flooding the database with accounts).
variable register_per_min 10

##### ---------------- ECONOMY / STARTING STATE ---------------- #####
variable start_cash     500

##### ---------------- JAIL / HOSPITAL ---------------- #####
variable jail_time      5          ;# minutes
variable hospital_time  2          ;# minutes; release restores player to 50% HP
# min must not exceed max -- cmd_bribe rolls min + rand()*(max-min+1),
# so an inverted pair produces a negative charge, i.e. it pays the
# player to leave jail. Swapped at load if you get them backwards.
variable jail_bribe_min 50000
variable jail_bribe_max 1000000
variable jail_risk_multiplier 0.50
variable hide_time      10         ;# minutes max hide duration

##### ---------------- COMBAT / ACTION COOLDOWNS ---------------- #####
variable crime_cooldown 8           ;# seconds
variable attack_cooldown 60        ;# seconds
variable rob_cooldown 60           ;# seconds
variable deal_cooldown  90         ;# seconds
variable streetfight_cooldown 8    ;# seconds
variable npcfight_cooldown    12   ;# seconds -- tougher/unpredictable than cpu, so longer cooldown
variable hitfight_cooldown    15   ;# seconds
variable stealthfight_cooldown 60  ;# seconds
variable wiretap_cooldown     100  ;# seconds
variable boss_cooldown  45         ;# seconds between boss attempts
variable job_cooldown 8            ;# seconds between jobs
variable gamble_cooldown 20        ;# seconds between gambles

##### ---------------- PASSIVE OPERATIONS ---------------- #####
variable pimp_collect_cooldown 3600     ;# seconds between pimp collect runs
variable casino_collect_cooldown 3600   ;# seconds between casino collect runs
variable dealer_collect_cooldown 3600   ;# seconds between dealer collect runs
# Cash back (as a % of base_cost) when letting a dealer go. Range 0-99,
# enforced at load: at 100 or more, buying a dealer and immediately
# removing them pays out more than it cost -- an unlimited money loop.
variable dealer_refund_pct 40

# Autoheal (!mafia autoheal on/off): once toggled on, a medkit is
# auto-consumed the moment a combat hit leaves the player at or below
# this percent of their max health, provided they're still alive and
# actually carrying a medkit. It only ever prevents a trip to the
# hospital -- it never fires once health has already hit 0.
variable autoheal_threshold_pct 25

##### ---------------- RANDOM ENCOUNTERS ---------------- #####
variable encounter_min_gap  3600   ;# ambient encounter spacing floor (daily cap is authoritative)
variable encounter_max_gap  10800  ;# ambient encounter spacing ceiling
variable encounter_daily_limit 5    ;# max ambient random encounters per channel per day
variable encounter_response_time 25 ;# seconds to respond before an encounter auto-resolves

##### ---------------- ACCOUNT CLEANUP ---------------- #####
# A player is "inactive" once last_seen is this many days old. Mirrors
# the manual !mafiaadmin prune broom: prune defaults to this value when
# no <days> is given, !mafiaadmin nearing uses cleanup_warn_days to flag
# accounts approaching (but not yet past) the cutoff, and the recurring
# timer sweeps automatically on the same threshold.
variable inactive_days 180
variable cleanup_warn_days 14
variable auto_cleanup_interval_days 180 ;# how often the automatic sweep runs
variable auto_cleanup_poll_secs 21600   ;# how often the timer wakes up to check if it's due

##### ---------------- LEVEL CAP ---------------- #####
variable max_health      100
# max_level must be at least 2: stat_target_for_level divides by
# (max_level - 1), and build_level_thresholds allocates one list element
# per level at load, so both ends of this are checked (2-100000).
variable max_level     1000

##### ---------------- LEGENDARY GEAR ---------------- #####
# Together these are what make the legendary set rare: at the defaults a
# player gets one 5% roll every 10 minutes on the black market, so a
# single piece averages a few hours of active trading and the full
# four-piece set considerably longer -- no amount of cash buys the roll
# faster. Both are !mafiaadmin config-editable and range-checked the same
# way here as there (legend_drop_pct: 0-100, legend_roll_cooldown:
# 30-604800); they were missing from earlier releases of this file, which
# meant an operator could change them live with !mafiaadmin config but
# any edit was silently lost on the next .rehash, since mafia.tcl had
# nothing here to read back and fell through to its own hardcoded 5/600.
variable legend_drop_pct      5    ;# percent chance per eligible black-market roll; 0 disables legendary drops
variable legend_roll_cooldown 600  ;# seconds between eligible rolls, per player
