# /etc/sysctl.d/60-locsec-hardening.conf
# Kernel/network hardening for Debian, Ubuntu and Linux Mint desktops and laptops, derived from Lynis KRNL-6000.
# Installed by the locsecd package as a conffile: edits and deletions survive
# upgrades. To opt out, delete this file and reboot -- `sudo sysctl --system`
# re-reads what is left, but a value already applied to the running kernel keeps
# its current setting until the next boot. Values the distribution already sets
# to the same thing are listed anyway so the intent survives a default change.
#
# Comments go on their own line: sysctl.d has no end-of-line comments, and before 5.0-14
# "1   # only root reads ..." reached the kernel as the value, which logged a write error.
#
# Deliberately NOT included -- see the notes at the bottom for why.

# --- kernel information leaks -------------------------------------------------
# only root reads the kernel ring buffer
kernel.dmesg_restrict = 1
# never expose kernel pointers in /proc
kernel.kptr_restrict = 2
# no core dumps from setuid programs
fs.suid_dumpable = 0
# no writes to FIFOs you do not own in sticky dirs
fs.protected_fifos = 2
# same for regular files
fs.protected_regular = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# --- 5.0-14: process and BPF hardening -----------------------------------------
# A process may only debug (ptrace) its own children; root can still debug anything.
# Ubuntu and Mint already ship 1; Debian ships 0. To attach gdb or strace to a running
# program you did not start, use sudo, or set 0 in a file named 61-*.conf.
kernel.yama.ptrace_scope = 1
# No BPF programs for unprivileged users (a frequent kernel exploit route). Debian and
# Ubuntu kernels already default to 2 (off, but root may switch it back on); 1 cannot be
# switched back on until the next boot, which is the point.
kernel.unprivileged_bpf_disabled = 1
# Constant blinding for the BPF JIT for every user, root included (JIT spraying).
net.core.bpf_jit_harden = 2

# --- IPv4 -------------------------------------------------------------------
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
# log spoofed/impossible source addresses
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
# 5.0-14: loose reverse-path filtering: drop packets whose source address is not
# reachable through ANY interface (spoofed). Safe with VPNs and several networks at
# once; strict mode (1) is still left out, see the notes at the bottom.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# --- IPv6 -------------------------------------------------------------------
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- Left out on purpose ------------------------------------------------------
# net.ipv4.conf.all.rp_filter = 1
#   Strict reverse-path filtering. Lynis asks for it; it silently drops packets on
#   multi-homed setups and with some VPNs (WireGuard, split-tunnel OpenVPN). This
#   file sets 2 (loose, from 5.0-14), which is the safer choice on a laptop that
#   roams. Set 1 in a file named 61-*.conf only if you do not use a VPN, and make it
#   the first thing you remove if traffic starts disappearing.
#
# net.ipv6.conf.all.accept_ra = 0
#   Breaks IPv6 autoconfiguration on any network that relies on router
#   advertisements, which is most of them. Do not set this on a laptop.
#
# kernel.sysrq = 0
#   Disables magic SysRq. On a laptop that is your last resort for a clean
#   shutdown when the desktop locks up (REISUB). Not worth trading away.
#
# kernel.unprivileged_userns_clone = 0 / user.max_user_namespaces = 0
#   Breaks Flatpak, the Chrome/Chromium sandbox and snaps. Never set these on a
#   desktop; it removes more security than it adds.
#
# kernel.perf_event_paranoid = 3
#   Blocks perf profiling for non-root. Skipped because you develop on this box.
#
# net.ipv4.conf.all.forwarding = 0
#   Set this only if you never run VMs, containers or a VPN that routes for you.
